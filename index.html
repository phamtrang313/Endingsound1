<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ending Sounds Bài 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
  :root {
    --paper: #fff8ec;
    --card: #ffffff;
    --ink: #2a2540;
    --muted: #6f6a82;
    --line: #eadfc8;
    --blue: #2f7bd6;
    --blue-soft: #e6f0fc;
    --orange: #ef5f24;
    --orange-soft: #fff0dc;
    --green: #23945a;
    --green-soft: #e3f5ea;
    --silent: #b9b4c7;
    --good: #23945a;
    --mid: #e59a0b;
    --bad: #d6453d;
    --display: "Baloo 2", "Poppins", "Nunito", "Segoe UI", sans-serif;
    --body: "Nunito", "Poppins", "Segoe UI", sans-serif;
    --emoji: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }

  header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .brand h1 { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; margin: 0; color: var(--orange); }
  .brand p { margin: 4px 0 0; color: var(--muted); }
  .btn { font: 700 15px var(--body); border: 2px solid var(--ink); background: var(--card); color: var(--ink);
         border-radius: 999px; padding: 8px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--blue-soft); }
  .btn:focus-visible, .tab:focus-visible, .card:focus-visible, .mini:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .tab { font: 800 17px var(--display); border: 2px solid var(--line); background: var(--card); color: var(--ink);
         border-radius: 14px; padding: 6px 16px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }

  .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .legend b { color: var(--ink); }

  .pair { display: none; }
  .pair.active { display: block; }
  .pair-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .pair-head h2 { font-family: var(--display); font-size: 26px; margin: 0; color: var(--blue); }
  .progress { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .print-title { display: none; }

  .board { border: 3px solid var(--blue); border-radius: 20px; overflow: hidden; background: var(--card); }
  .board-head, .sound-block { display: grid; grid-template-columns: 150px 1fr; }
  .board-head { background: var(--blue); color: #fff; font-weight: 800; }
  .board-head div { padding: 10px 12px; text-align: center; }
  .board-head .right { display: grid; grid-template-columns: 110px 1fr; padding: 0; }
  .board-head .right div + div, .board-head > div + div { border-left: 2px solid rgba(255,255,255,.35); }

  .sound-block + .sound-block { border-top: 3px solid var(--blue); }
  .sound { padding: 14px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .voiceless .sound { background: var(--orange-soft); }
  .voiced .sound { background: var(--green-soft); }
  .ipa { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 1; }
  .voiceless .ipa { color: var(--orange); }
  .voiced .ipa { color: var(--green); }
  .teal .sound { background: #dff5f3; }
  .teal .ipa { color: #0f8a80; }
  .teal .word u { color: #0f8a80; border-bottom-color: #0f8a80; }
  .d-word.teal u { color: #0f8a80; border-bottom-color: #0f8a80; }
  .purple .sound { background: #f1e9ff; }
  .purple .ipa { color: #8a4fd6; }
  .purple .word u { color: #8a4fd6; border-bottom-color: #8a4fd6; }
  .d-word.purple u { color: #8a4fd6; border-bottom-color: #8a4fd6; }
  .tip { font-size: 13px; color: var(--muted); line-height: 1.35; }
  .throat { font-size: 13px; background: var(--card); border-radius: 999px; padding: 3px 10px; }

  .end-row { display: grid; grid-template-columns: 110px 1fr; border-left: 2px solid var(--line); }
  .end-row + .end-row { border-top: 2px dashed var(--line); }
  .ending { padding: 12px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-right: 2px solid var(--line); }
  .tag { font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--blue); background: var(--blue-soft); border-radius: 12px; padding: 2px 14px; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.3; }

  .words { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; padding: 12px; }
  .card { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 4px 8px;
          text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
          transition: transform .12s ease, border-color .12s ease; }
  .card:hover { transform: translateY(-2px); border-color: var(--blue); }
  .pic { font-family: var(--emoji); font-size: 44px; line-height: 1.15; }
  .word { font-weight: 800; font-size: 21px; letter-spacing: .5px; white-space: nowrap; }
  .word u { text-decoration: none; color: var(--orange); border-bottom: 4px solid var(--orange); }
  .voiced .word u { color: var(--green); border-bottom-color: var(--green); }
  .word .silent { color: var(--silent); }
  .meaning { font-size: 12px; color: var(--muted); }
  .card-actions { display: flex; gap: 6px; margin-top: 6px; }
  .mini { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); cursor: pointer;
          font-family: var(--emoji); font-size: 16px; display: grid; place-items: center; padding: 0; }
  .mini:hover { border-color: var(--blue); background: var(--blue-soft); }
  .mini.rec:hover { border-color: var(--bad); background: #fdecea; }
  .best { position: absolute; top: 6px; right: 6px; font: 800 12px var(--body); border-radius: 999px; padding: 1px 7px; color: #fff; font-variant-numeric: tabular-nums; }
  .best.hi { background: var(--good); } .best.md { background: var(--mid); } .best.lo { background: var(--bad); }

  .foot { font-size: 14px; color: var(--muted); margin-top: 12px; }

  /* Practice dialog */
  .overlay { position: fixed; inset: 0; background: rgba(42,37,64,.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay.open { display: flex; }
  .dialog { background: var(--card); border-radius: 24px; width: min(460px, 100%); padding: 20px 20px 22px; text-align: center; position: relative;
            border: 4px solid var(--blue); max-height: 100%; overflow-y: auto; }
  .dialog .close { position: absolute; top: 10px; right: 10px; }
  .d-sound { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--muted); }
  .d-pic { font-family: var(--emoji); font-size: 92px; line-height: 1.1; margin-top: 4px; }
  .d-word { font-weight: 800; font-size: 44px; letter-spacing: 1px; }
  .d-word u { text-decoration: none; color: var(--orange); border-bottom: 6px solid var(--orange); }
  .d-word.voiced u { color: var(--green); border-bottom-color: var(--green); }
  .d-word .silent { color: var(--silent); }
  .d-meaning { color: var(--muted); margin-bottom: 14px; }
  .d-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .big { font: 800 17px var(--body); border-radius: 999px; padding: 12px 18px; border: 0; cursor: pointer; color: #fff; display: inline-flex; gap: 8px; align-items: center; }
  .big .e { font-family: var(--emoji); }
  .big.listen { background: var(--blue); }
  .big.record { background: var(--bad); }
  .big.replay { background: var(--ink); }
  .big:disabled { opacity: .45; cursor: default; }
  .big.recording { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(214,69,61,.2); } }
  @media (prefers-reduced-motion: reduce) { .big.recording { animation: none; } .card { transition: none; } }

  .result { margin-top: 16px; min-height: 96px; border-radius: 18px; padding: 12px; background: var(--paper); }
  .score { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
  .score small { font-size: 22px; color: var(--muted); }
  .score.hi { color: var(--good); } .score.md { color: var(--mid); } .score.lo { color: var(--bad); }
  .stars { font-family: var(--emoji); font-size: 22px; letter-spacing: 2px; }
  .msg { font-weight: 700; margin-top: 4px; }
  .heard { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .d-nav { display: flex; justify-content: space-between; margin-top: 14px; }

  .warn { display: none; background: #fdecea; border: 2px solid var(--bad); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-size: 14px; margin: 12px 0 0; }
  .warn.show { display: block; }

  @media (max-width: 760px) {
    .board-head { display: none; }
    .sound-block { grid-template-columns: 1fr; }
    .sound { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; text-align: left; gap: 8px 12px; }
    .ipa { font-size: 38px; }
    .end-row { grid-template-columns: 1fr; border-left: 0; }
    .ending { flex-direction: row; justify-content: flex-start; border-right: 0; padding: 10px 12px 0; }
    .words { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  }

  @page { size: A4; margin: 12mm; }
  @media print {
    body { background: #fff; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wrap { max-width: none; padding: 0; }
    header.top, .tabs, .legend, .card-actions, .best, .overlay, .warn, .progress { display: none !important; }
    .pair { display: block !important; break-after: page; }
    .pair:last-child { break-after: auto; }
    .print-title { display: block; font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--orange); text-align: center; margin: 0; }
    .pair-head { justify-content: center; margin-bottom: 8px; }
    .pair-head h2 { font-size: 20px; }
    .board-head, .sound-block { grid-template-columns: 112px 1fr; }
    .board-head .right, .end-row { grid-template-columns: 80px 1fr; }
    .sound-block, .end-row { break-inside: avoid; }
    .words { gap: 6px; padding: 8px; }
    .card { padding: 6px 2px; border-radius: 12px; }
    .pic { font-size: 34px; }
    .word { font-size: 16px; letter-spacing: 0; }
    .meaning { font-size: 10px; }
    .tag { font-size: 20px; padding: 2px 8px; }
    .ipa { font-size: 38px; }
    .tip, .throat, .note { font-size: 10.5px; }
    .foot { text-align: center; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Ending Sounds – Bài 1</h1>
      <p>Bấm vào từ để nghe, rồi bấm 🎤 để đọc và nhận điểm.</p>
    </div>
    <button class="btn" id="printBtn" type="button">⬇ Tải PDF</button>
  </header>

  <div class="warn" id="warn"></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="legend">
    <span><b>🔊</b> nghe mẫu</span>
    <span><b>🎤</b> bé đọc và chấm điểm</span>
    <span><b>✋</b> đặt tay lên cổ: các âm trong bài đều <b>không rung</b>, chỉ bật hơi hoặc xì hơi</span>
  </div>

  <main id="pairs"></main>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dWord">
    <button class="mini close" id="dClose" type="button" aria-label="Đóng">✖️</button>
    <div class="d-sound" id="dSound"></div>
    <div class="d-pic" id="dPic"></div>
    <div class="d-word" id="dWord"></div>
    <div class="d-meaning" id="dMeaning"></div>
    <div class="d-actions">
      <button class="big listen" id="dListen" type="button"><span class="e">🔊</span> Nghe mẫu</button>
      <button class="big record" id="dRecord" type="button"><span class="e">🎤</span> Bé đọc</button>
      <button class="big replay" id="dReplay" type="button" disabled><span class="e">▶️</span> Nghe lại giọng bé</button>
    </div>
    <div class="result" id="dResult">
      <div class="msg">Bấm “Nghe mẫu”, sau đó bấm “Bé đọc” và đọc to từ này.</div>
    </div>
    <div class="d-nav">
      <button class="btn" id="dPrev" type="button">◀ Từ trước</button>
      <button class="btn" id="dNext" type="button">Từ sau ▶</button>
    </div>
  </div>
</div>

<script>
// [emoji, stem, underlined ending, silent letters, Vietnamese meaning]
const DATA = [
 { title: "Trang 1: /p/ và /t/", sounds: [
   { ipa: "/p/", key: "p", voiced: false, tip: "Mím 2 môi rồi bật hơi “p”", throat: "Cổ <b>không rung</b>", endings: [
     { end: "-p", note: "", words: [["☕","cu","p","","cái cốc"],["🗺️","ma","p","","bản đồ"],["🐑","shee","p","","con cừu"],["🚢","shi","p","","con tàu"],["🧼","soa","p","","xà phòng"]] },
     { end: "-pe", note: "chữ <b>e</b> câm", words: [["🍇","gra","p","e","quả nho"],["🪢","ro","p","e","sợi dây"],["🦍","a","p","e","con vượn"],["✉️","envelo","p","e","phong bì"],["🔭","telesco","p","e","kính thiên văn"]] } ] },
   { ipa: "/t/", key: "t", voiced: false, tip: "Chạm lưỡi sau răng trên, bật hơi “t”", throat: "Cổ <b>không rung</b>", endings: [
     { end: "-t", note: "", words: [["🐱","ca","t","","con mèo"],["🎩","ha","t","","cái mũ"],["🐰","rabbi","t","","con thỏ"],["🥕","carro","t","","cà rốt"],["🤖","robo","t","","rô-bốt"]] },
     { end: "-te", note: "chữ <b>e</b> câm", words: [["🪁","ki","t","e","con diều"],["🍽️","pla","t","e","cái đĩa"],["⛸️","ska","t","e","giày trượt"],["🍫","chocola","t","e","sô-cô-la"],["🎵","no","t","e","nốt nhạc"]] } ] }
 ]},
 { title: "Trang 2: /k/ và /ch/", sounds: [
   { ipa: "/k/", key: "k", voiced: false, tip: "Cuống lưỡi chạm vòm họng, bật hơi “k”", throat: "Cổ <b>không rung</b>", endings: [
     { end: "-k", note: "", words: [["📖","boo","k","","quyển sách"],["🥛","mil","k","","sữa"],["🍴","for","k","","cái dĩa"],["🦈","shar","k","","cá mập"],["🥤","drin","k","","đồ uống"]] },
     { end: "-ck", note: "c + k đọc chung là /k/", words: [["🦆","du","ck","","con vịt"],["🧦","so","ck","","chiếc tất"],["⏰","clo","ck","","đồng hồ"],["🚚","tru","ck","","xe tải"],["🪨","ro","ck","","hòn đá"]] },
     { end: "-ke", note: "chữ <b>e</b> câm", words: [["🎂","ca","k","e","bánh ngọt"],["🚲","bi","k","e","xe đạp"],["🐍","sna","k","e","con rắn"],["🏞️","la","k","e","hồ nước"],["😂","jo","k","e","trò đùa"]] } ] } ,
   { ipa: "/ch/", key: "ch", voiced: false, color: "teal", tip: "Môi hơi chu, lưỡi chạm vòm miệng rồi bật hơi “ch”", throat: "Cổ <b>không rung</b>", endings: [
     { end: "-ch", note: "c + h đọc chung là /ch/", words: [["🍱","lun","ch","","bữa trưa"],["🍑","pea","ch","","quả đào"],["🏖️","bea","ch","","bãi biển"],["🪑","ben","ch","","ghế dài"],["🥪","sandwi","ch","","bánh mì kẹp"]] },
     { end: "-tch", note: "t + ch đọc là /ch/", words: [["⌚","wa","tch","","đồng hồ đeo tay"],["🧙‍♀️","wi","tch","","phù thủy"],["⚾","ca","tch","","bắt (bóng)"],["🐣","ha","tch","","nở ra"],["🤸","stre","tch","","vươn người"]] } ] }
 ]},
 { title: "Trang 3: /s/ và /sh/", sounds: [
   { ipa: "/s/", key: "s", voiced: false, tip: "Răng khép lại, xì hơi “sss” như con rắn", throat: "Cổ <b>không rung</b>", endings: [
     { end: "-s", note: "", words: [["🚌","bu","s","","xe buýt"],["✅","ye","s","","vâng, đúng"],["⛽","ga","s","","xăng"],["🐙","octopu","s","","bạch tuộc"],["🌵","cactu","s","","cây xương rồng"]] },
     { end: "-ss", note: "2 chữ s đọc là 1 âm /s/", words: [["👗","dre","ss","","váy"],["🌱","gra","ss","","cỏ"],["♟️","che","ss","","cờ vua"],["😘","ki","ss","","nụ hôn"],["🏫","cla","ss","","lớp học"]] },
     { end: "-ce", note: "c + e câm đọc là /s/", words: [["🧊","i","c","e","nước đá"],["🍚","ri","c","e","cơm"],["🙂","fa","c","e","khuôn mặt"],["🧃","jui","c","e","nước ép"],["🍕","sli","c","e","miếng bánh"]] },
     { end: "-se", note: "chữ <b>e</b> câm", words: [["🏠","hou","s","e","ngôi nhà"],["🐁","mou","s","e","con chuột"],["🐴","hor","s","e","con ngựa"],["👩‍⚕️","nur","s","e","y tá"],["👛","pur","s","e","cái ví"]] } ] },
   { ipa: "/sh/", key: "sh", voiced: false, color: "purple", tip: "Chu môi tròn, đẩy hơi “shhh” như khi bảo im lặng", throat: "Cổ <b>không rung</b>", endings: [
     { end: "-sh", note: "s + h đọc chung là /sh/", words: [["🐟","fi","sh","","con cá"],["🥣","di","sh","","cái bát, món ăn"],["🪥","bru","sh","","bàn chải"],["🫧","wa","sh","","rửa, giặt"],["💦","spla","sh","","té nước"]] } ] }
 ]},
 { title: "Trang 4: /f/ và /th/", sounds: [
   { ipa: "/f/", key: "f", voiced: false, tip: "Răng trên chạm môi dưới, thổi hơi “fff”", throat: "Cổ <b>không rung</b>", endings: [
     { end: "-f", note: "", words: [["🍃","lea","f","","chiếc lá"],["🐺","wol","f","","chó sói"],["🧣","scar","f","","khăn quàng"],["👨‍🍳","che","f","","đầu bếp"],["🧝","el","f","","chú lùn"]] },
     { end: "-ff", note: "2 chữ f đọc là 1 âm /f/", words: [["🏔️","cli","ff","","vách đá"],["👃","sni","ff","","ngửi"],["💨","pu","ff","","thổi phù"],["📴","o","ff","","tắt"],["🎒","stu","ff","","đồ đạc"]] },
     { end: "-fe", note: "chữ <b>e</b> câm", words: [["🔪","kni","f","e","con dao"],["🦒","gira","ff","e","hươu cao cổ"],["👰","wi","f","e","người vợ"],["🔒","sa","f","e","an toàn"],["🌱","li","f","e","sự sống"]] } ] },
   { ipa: "/th/", key: "th", voiced: false, color: "purple", tip: "Đặt đầu lưỡi giữa 2 hàm răng, thổi hơi nhẹ", throat: "Cổ <b>không rung</b>", endings: [
     { end: "-th", note: "t + h đọc chung là /th/", words: [["🛁","ba","th","","tắm"],["➗","ma","th","","môn toán"],["👄","mou","th","","cái miệng"],["🦷","too","th","","cái răng"],["🌍","ear","th","","Trái Đất"]] } ] }
 ]}
];
const CONFUSE = { p: ["b", "f"], t: ["d", "ch", "th"], k: ["g"], s: ["sh", "th", "z"], sh: ["s", "ch"], ch: ["sh", "t"], f: ["th", "p"], th: ["f", "s", "t"] };
const SAME_SOUND = { red: ["read"] };

// Flatten words for navigation
const WORDS = [];
DATA.forEach((pair, pi) => pair.sounds.forEach(s => s.endings.forEach(e => e.words.forEach(w => {
  WORDS.push({ pi, sound: s, ending: e, emoji: w[0], stem: w[1], ul: w[2], silent: w[3], vi: w[4], text: (w[1] + w[2] + w[3]).toLowerCase() });
}))));

// Best scores (per browser)
let best = {};
try { best = JSON.parse(localStorage.getItem("es1-best") || "{}") || {}; } catch (e) { best = {}; }
function saveBest() { try { localStorage.setItem("es1-best", JSON.stringify(best)); } catch (e) {} }
const level = s => s >= 8 ? "hi" : s >= 5 ? "md" : "lo";

function wordHTML(w) {
  return `${w.stem}<u>${w.ul}${w.silent ? `<span class="silent">${w.silent}</span>` : ""}</u>`;
}

// Render
const pairsEl = document.getElementById("pairs");
const tabsEl = document.getElementById("tabs");
DATA.forEach((pair, pi) => {
  const tab = document.createElement("button");
  tab.className = "tab"; tab.type = "button"; tab.setAttribute("role", "tab");
  tab.textContent = pair.title; tab.dataset.pi = pi;
  tab.addEventListener("click", () => showPair(pi));
  tabsEl.appendChild(tab);

  const sec = document.createElement("section");
  sec.className = "pair"; sec.dataset.pi = pi;
  let html = `<div class="print-title">Ending Sounds – Bài 1</div>
    <div class="pair-head"><h2>${pair.title}</h2><span class="progress" data-progress="${pi}"></span></div>
    <div class="board"><div class="board-head"><div>Âm</div><div class="right"><div>Đuôi từ</div><div>Ví dụ</div></div></div>`;
  pair.sounds.forEach(s => {
    html += `<div class="sound-block ${s.voiced ? "voiced" : "voiceless"} ${s.color || ""}">
      <div class="sound"><div class="ipa">${s.ipa}</div><div class="tip">${s.tip}</div><div class="throat">✋ ${s.throat}</div></div><div>`;
    s.endings.forEach(e => {
      html += `<div class="end-row"><div class="ending"><span class="tag">${e.end}</span>${e.note ? `<div class="note">${e.note}</div>` : ""}</div><div class="words">`;
      e.words.forEach(wd => {
        const idx = WORDS.findIndex(x => x.ending === e && x.emoji === wd[0]);
        const w = WORDS[idx];
        html += `<div class="card" tabindex="0" role="button" data-idx="${idx}" aria-label="Luyện từ ${w.text}">
          <span class="best" data-best="${idx}" hidden></span>
          <div class="pic">${w.emoji}</div>
          <div class="word">${wordHTML(w)}</div>
          <div class="meaning">${w.vi}</div>
          <div class="card-actions">
            <button class="mini" type="button" data-say="${idx}" aria-label="Nghe từ ${w.text}">🔊</button>
            <button class="mini rec" type="button" data-rec="${idx}" aria-label="Đọc từ ${w.text}">🎤</button>
          </div></div>`;
      });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  });
  html += `</div><p class="foot">Bé đọc to mỗi từ 3 lần, nhớ đọc rõ âm cuối ở phần gạch chân.</p>`;
  sec.innerHTML = html;
  pairsEl.appendChild(sec);
});

function showPair(pi) {
  document.querySelectorAll(".pair").forEach(s => s.classList.toggle("active", +s.dataset.pi === pi));
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", +t.dataset.pi === pi ? "true" : "false"));
}
showPair(0);

function refreshBadges() {
  document.querySelectorAll("[data-best]").forEach(b => {
    const w = WORDS[+b.dataset.best]; const s = best[w.text];
    if (s == null) { b.hidden = true; b.style.display = "none"; return; }
    b.hidden = false; b.style.display = ""; b.textContent = s; b.className = "best " + level(s);
  });
  DATA.forEach((pair, pi) => {
    const list = WORDS.filter(w => w.pi === pi);
    const done = list.filter(w => best[w.text] != null);
    const avg = done.length ? (done.reduce((a, w) => a + best[w.text], 0) / done.length).toFixed(1) : "–";
    const el = document.querySelector(`[data-progress="${pi}"]`);
    if (el) el.textContent = `Đã luyện ${done.length}/${list.length} từ · Điểm trung bình ${avg}`;
  });
}
refreshBadges();

// ---------- Text to speech ----------
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => /^en(-|_)?(US|GB)?/i.test(v.lang));
  const pref = ["Google US English", "Samantha", "Microsoft Aria", "Microsoft Jenny", "Microsoft Zira", "Google UK English Female"];
  voice = pref.map(n => vs.find(v => v.name.includes(n))).find(Boolean) || vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!("speechSynthesis" in window)) { showWarn("Trình duyệt này không đọc được âm thanh mẫu. Hãy mở bằng Google Chrome hoặc Microsoft Edge."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.75; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

function showWarn(t) { const w = document.getElementById("warn"); w.textContent = t; w.classList.add("show"); }

// ---------- Practice dialog ----------
const $ = id => document.getElementById(id);
let cur = 0, recAudioURL = null;
function openDialog(idx, autoRecord) {
  cur = idx; const w = WORDS[idx];
  $("dSound").textContent = `Âm cuối ${w.sound.ipa} · đuôi ${w.ending.end}`;
  $("dPic").textContent = w.emoji;
  $("dWord").innerHTML = wordHTML(w);
  $("dWord").className = "d-word" + (w.sound.voiced ? " voiced" : "") + (w.sound.color ? " " + w.sound.color : "");
  $("dMeaning").textContent = w.vi;
  $("dResult").innerHTML = best[w.text] != null
    ? `<div class="msg">Điểm cao nhất của bé: ${best[w.text]}/10. Đọc lại để cao hơn nhé!</div>`
    : `<div class="msg">Bấm “Nghe mẫu”, sau đó bấm “Bé đọc” và đọc to từ này.</div>`;
  if (recAudioURL) { URL.revokeObjectURL(recAudioURL); recAudioURL = null; }
  $("dReplay").disabled = true;
  $("overlay").classList.add("open"); $("overlay").setAttribute("aria-hidden", "false");
  if (autoRecord) startRecord(); else { say(w.text); $("dListen").focus(); }
}
function closeDialog() {
  stopAll();
  $("overlay").classList.remove("open"); $("overlay").setAttribute("aria-hidden", "true");
}
$("dClose").onclick = closeDialog;
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeDialog(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("overlay").classList.contains("open")) closeDialog(); });
$("dListen").onclick = () => say(WORDS[cur].text);
$("dPrev").onclick = () => { stopAll(); openDialog((cur - 1 + WORDS.length) % WORDS.length); };
$("dNext").onclick = () => { stopAll(); openDialog((cur + 1) % WORDS.length); };
$("dReplay").onclick = () => { if (recAudioURL) new Audio(recAudioURL).play(); };
$("dRecord").onclick = () => { if (recognizing) stopAll(); else startRecord(); };

pairsEl.addEventListener("click", e => {
  const sayBtn = e.target.closest("[data-say]"); if (sayBtn) { e.stopPropagation(); say(WORDS[+sayBtn.dataset.say].text); return; }
  const recBtn = e.target.closest("[data-rec]"); if (recBtn) { e.stopPropagation(); openDialog(+recBtn.dataset.rec, true); return; }
  const card = e.target.closest(".card"); if (card) openDialog(+card.dataset.idx);
});
pairsEl.addEventListener("keydown", e => {
  const card = e.target.closest(".card");
  if (card && e.target === card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDialog(+card.dataset.idx); }
});

// ---------- Recording + scoring ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizing = false, recog = null, mediaRec = null, stream = null, chunks = [], gotResult = false, safety = null;

async function startRecord() {
  const w = WORDS[cur];
  if (window.speechSynthesis) speechSynthesis.cancel();
  $("dResult").innerHTML = `<div class="msg">🎙️ Bé đọc to: <b>${w.text}</b></div><div class="heard">Máy đang nghe...</div>`;
  $("dRecord").classList.add("recording"); $("dRecord").innerHTML = `<span class="e">⏹️</span> Dừng`;
  recognizing = true; gotResult = false; chunks = [];

  // Record the child's voice for replay
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
    mediaRec.onstop = () => {
      if (chunks.length) { recAudioURL = URL.createObjectURL(new Blob(chunks, { type: mediaRec.mimeType || "audio/webm" })); $("dReplay").disabled = false; }
      if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
    };
    mediaRec.start();
  } catch (err) {
    resetRecordBtn(); recognizing = false;
    $("dResult").innerHTML = `<div class="msg">Chưa dùng được micro.</div><div class="heard">Hãy bấm “Cho phép” (Allow) khi trình duyệt hỏi quyền dùng micro, rồi thử lại.</div>`;
    return;
  }

  if (!SR) {
    safety = setTimeout(stopAll, 3000);
    showWarn("Trình duyệt này ghi âm được nhưng không chấm điểm được. Hãy mở bằng Google Chrome hoặc Microsoft Edge để có điểm.");
    return;
  }
  recog = new SR();
  recog.lang = "en-US"; recog.maxAlternatives = 5; recog.interimResults = false; recog.continuous = false;
  recog.onresult = ev => {
    gotResult = true;
    const alts = Array.from(ev.results[0]).map(a => ({ t: a.transcript, c: a.confidence }));
    const r = grade(w, alts);
    if (r) showScore(r, alts[0] ? alts[0].t : "");
    else $("dResult").innerHTML = `<div class="msg">Máy chưa nghe rõ.</div><div class="heard">Bé đọc to và gần micro hơn một chút nhé.</div>`;
  };
  recog.onerror = ev => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      $("dResult").innerHTML = `<div class="msg">Trình duyệt chưa cho phép nhận giọng nói.</div><div class="heard">Hãy cho phép micro, và mở trang khi máy có kết nối Internet.</div>`;
      gotResult = true;
    } else if (ev.error === "network") {
      $("dResult").innerHTML = `<div class="msg">Cần kết nối Internet để chấm điểm.</div><div class="heard">Bé vẫn có thể bấm “Nghe lại giọng bé” để tự nghe.</div>`;
      gotResult = true;
    }
  };
  recog.onend = () => {
    if (!gotResult && $("overlay").classList.contains("open")) {
      $("dResult").innerHTML = `<div class="msg">Máy chưa nghe rõ.</div><div class="heard">Bé đọc to và gần micro hơn một chút nhé.</div>`;
    }
    stopAll();
  };
  try { recog.start(); } catch (e) {}
  safety = setTimeout(stopAll, 8000);
}

function resetRecordBtn() {
  $("dRecord").classList.remove("recording"); $("dRecord").innerHTML = `<span class="e">🎤</span> Bé đọc lại`;
}
function stopAll() {
  clearTimeout(safety);
  if (recog) { try { recog.onend = null; recog.abort(); } catch (e) {} recog = null; }
  if (mediaRec && mediaRec.state === "recording") { try { mediaRec.stop(); } catch (e) {} }
  else if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  recognizing = false; resetRecordBtn();
}

// Last consonant sound of a spelled word (rough, by spelling)
function endClass(word) {
  let x = word.toLowerCase().replace(/[^a-z]/g, "");
  if (/sh$/.test(x)) return "sh";
  if (/ch$/.test(x)) return "ch";
  if (/th$/.test(x)) return "th";
  if (/(ff|fe|f|ph|ugh)$/.test(x)) return "f";
  if (/(ss|ce|se|s)$/.test(x)) return "s";
  if (/[^aeiou]e$/.test(x)) x = x.slice(0, -1);
  if (/ck$/.test(x)) return "k";
  const c = x.slice(-1);
  return { p: "p", b: "b", t: "t", d: "d", k: "k", c: "k", g: "g", x: "k" }[c] || null;
}
function tokens(t) { return t.toLowerCase().replace(/[^a-z' ]/g, " ").split(/\s+/).filter(Boolean); }

function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}

// Chấm điểm CHỈ dựa vào ÂM CUỐI của từ máy nghe được (không xét phần đầu từ)
function grade(w, alts) {
  const key = w.sound.key, ipa = w.sound.ipa;
  // Nếu máy nghe thành số nhiều (vd "cups"), bỏ chữ s cuối để xét âm trước đó
  const endsOf = a => tokens(a.t).flatMap(tk => (key !== "s" && /[^s]s$/.test(tk)) ? [endClass(tk), endClass(tk.slice(0, -1)), endClass(tk.replace(/es$/, ""))] : [endClass(tk)]);
  const first = alts[0] ? endsOf(alts[0]) : [];
  const any = alts.flatMap(endsOf);
  if (!alts.some(a => tokens(a.t).length)) return null; // không nghe được gì

  if (first.includes(key))
    return { s: 10, msg: `Tuyệt vời! Âm cuối ${ipa} rất chuẩn 🎉`, note: `✓ Âm cuối ${ipa}` };
  if (any.includes(key))
    return { s: 9, msg: `Rất giỏi! Âm cuối ${ipa} đúng rồi 👏`, note: `✓ Âm cuối ${ipa}` };
  const other = (CONFUSE[key] || []).find(c => any.includes(c));
  if (other) {
    const tip = w.sound.tip.replace(/<[^>]+>/g, "");
    return { s: 7, note: `Máy nghe âm cuối giống /${other}/`,
      msg: `Khá lắm! Âm cuối nghe hơi giống /${other}/. Mẹo đọc ${ipa}: ${tip}. Thử lại nào!` };
  }
  return { s: 6, note: `Máy chưa nghe rõ âm cuối ${ipa}`,
    msg: `Bé đã cố gắng rồi! Nhớ đọc rõ âm cuối ${ipa} ở phần gạch chân nhé 🌟` };
}

function showScore(r, heard) {
  const w = WORDS[cur];
  if (best[w.text] == null || r.s > best[w.text]) { best[w.text] = r.s; saveBest(); refreshBadges(); }
  const stars = "⭐".repeat(Math.round(r.s / 2)) || "💪";
  $("dResult").innerHTML = `<div class="score ${level(r.s)}">${r.s}<small>/10</small></div>
    <div class="stars">${stars}</div><div class="msg">${r.msg}</div>
    <div class="heard">Máy nghe thấy: “${heard.replace(/[<>&]/g, "")}”${r.note ? ` · ${r.note}` : ""}</div>`;
}

// ---------- PDF ----------
$("printBtn").onclick = () => window.print();
</script>
